; Exo 7 — Surcharge PHP montée dans le conteneur app et queue
; Chemin cible : /usr/local/etc/php/conf.d/local.ini (voir volumes dans docker-compose.yml)

upload_max_filesize = 50M   ; Taille max d'un fichier uploadé (formulaires, médias)
post_max_size       = 50M   ; Taille max du corps POST (doit être >= upload_max_filesize)
memory_limit        = 256M  ; Mémoire max par script PHP (migrations, jobs newsletter, etc.)
