# Exo 7 — Configuration Nginx pour servir Laravel (document root = public/)
# FastCGI transmet les fichiers .php au conteneur « app » sur le port 9000 (php-fpm)

server {
    listen 80;                          # Port HTTP interne du conteneur (mappé sur 8080 côté hôte)
    root /var/www/html/public;          # Point d'entrée Laravel — index.php dans public/
    index index.php;                    # Fichier par défaut pour les requêtes /

    # Toutes les requêtes non-fichiers sont réécrites vers index.php (routing Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Traitement des fichiers PHP via PHP-FPM (conteneur « app », port 9000)
    location ~ \.php$ {
        fastcgi_pass app:9000;          # Hôte « app » = nom du service dans docker-compose.yml
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;  # Chemin absolu du script PHP
        include fastcgi_params;         # Paramètres FastCGI standards (REQUEST_METHOD, etc.)
    }

    # Bloque l'accès aux fichiers .htaccess (sécurité — non utilisés par Nginx mais par précaution)
    location ~ /\.ht { deny all; }
}
