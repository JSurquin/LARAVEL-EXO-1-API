services:
  app:
    build: .
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      db:
        condition: service_healthy
    networks: [laravel]

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [laravel]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks: [laravel]

  redis:
    image: redis:7-alpine
    networks: [laravel]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks: [laravel]

  queue:
    build: .
    env_file: .env
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on: [app, redis, db]
    networks: [laravel]

volumes:
  db_data:

networks:
  laravel: