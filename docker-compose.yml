# Exo 7 — Orchestration Docker : PHP-FPM, Nginx, MySQL, Redis, Mailpit, worker queue
# Lancement : docker compose up -d  |  App : http://localhost:8080  |  Mailpit : http://localhost:8025

services:
  # Conteneur PHP-FPM — exécute le code Laravel (artisan, jobs, logique métier)
  app:
    build: .  # Construit l'image depuis le Dockerfile à la racine du projet
    env_file: .env  # Injecte les variables d'environnement Laravel (DB_HOST=db, REDIS_HOST=redis, etc.)
    volumes:
      - .:/var/www/html  # Monte le code local dans le conteneur (hot-reload en dev)
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini  # Surcharge PHP (upload, mémoire)
    depends_on:
      db:
        condition: service_healthy  # Attend que MySQL réponde au healthcheck avant de démarrer
    networks: [laravel]  # Réseau interne partagé avec les autres services

  # Reverse proxy HTTP — point d'entrée public de l'application (port 8080 → 80)
  nginx:
    image: nginx:alpine  # Image Nginx légère (Alpine Linux)
    ports: ["8080:80"]  # Accès navigateur : localhost:8080 → port 80 du conteneur
    volumes:
      - .:/var/www/html  # Même code source que app (document root = public/)
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf  # Config vhost Laravel
    depends_on: [app]  # Démarre après le conteneur PHP-FPM
    networks: [laravel]

  # Base de données MySQL 8.4 — remplace SQLite en environnement Docker
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}       # Nom de la BDD (lu depuis .env)
      MYSQL_USER: ${DB_USERNAME}           # Utilisateur applicatif Laravel
      MYSQL_PASSWORD: ${DB_PASSWORD}       # Mot de passe utilisateur
      MYSQL_ROOT_PASSWORD: root            # Mot de passe root (administration)
    volumes: [db_data:/var/lib/mysql]  # Persistance des données entre les redémarrages
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]  # Vérifie que MySQL accepte les connexions
      interval: 10s   # Fréquence du test
      retries: 5      # Nombre d'échecs avant « unhealthy »
    networks: [laravel]

  # Redis — cache, sessions et files d'attente (Exo 4, 5, worker queue)
  redis:
    image: redis:7-alpine
    networks: [laravel]

  # Mailpit — capture les e-mails en dev (newsletters Exo 5) — interface web sur le port 8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # UI : http://localhost:8025 — SMTP interne : mailpit:1025
    networks: [laravel]

  # Worker de queue — consomme les jobs Redis (SendNewsletterJob, etc.) sans lancer Horizon manuellement
  queue:
    build: .  # Même image PHP que « app »
    env_file: .env
    command: php artisan queue:work --tries=3 --sleep=3  # Écoute la queue ; 3 essais max ; pause 3 s entre jobs
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on: [app, redis, db]  # Nécessite PHP, Redis et MySQL opérationnels
    networks: [laravel]

# Volume nommé — données MySQL conservées même si le conteneur db est recréé
volumes:
  db_data:

# Réseau bridge isolé — les services se résolvent par nom (app, db, redis, mailpit…)
networks:
  laravel:
